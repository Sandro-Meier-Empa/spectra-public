# Toy recipe: synthetic scenes and plumes, no external data.
#
#   spectra generate examples/recipe_toy.yaml --out /tmp/spectra_toy --dry-run
#   spectra generate examples/recipe_toy.yaml --out /tmp/spectra_toy
#   spectra finalize examples/recipe_toy.yaml --out /tmp/spectra_toy
#
# The plume files are written by spectra.testing.make_plume_column, e.g.
#   from spectra.testing import make_plume_column
#   from spectra.plume.io import write_plume_column
#   write_plume_column(make_plume_column(case_id="caseA"), "plumes/caseA.plumecolumn.nc")
recipe_version: 1
name: toy
seed: 7
n_samples: 12
method: radiance
sensor:
  name: toy
  scenes: unused # required without a catalogue; the toy adapter needs no files
  options: {}
catalog:
  path: null # list scenes with the adapter instead of a catalogue
  status: [eligible]
  filters: {}
plumes:
  files:
    - plumes/*.plumecolumn.nc # relative to this file
  time_policy:
    mode: uniform
    min_simulation_time_s: 60.0
  emission:
    distribution: loguniform
    low: 100.0
    high: 2000.0
    units: kg h-1
  column_convention: vertical
placement:
  mode: anchor
  rotations_deg: {mode: uniform_int, low: 0, high: 359}
  flips: {none: 0.5, x: 0.25, y: 0.25}
  anchor_corners: [lower left, lower right, upper left, upper right]
  min_outside_fraction: 0.0
  max_outside_fraction: 0.0
  max_attempts: 10000
  window_shape: [24, 24]
embedding:
  regridder: polygon
  regridder_options: {}
  lut:
    enhancement_min_ppm: 0.01
    enhancement_max_ppm: 200.0
    n_nodes: 12
    layer_height_m: 1000.0
    radiance_leg: both
  unit_absorption:
    provider: toy
    options: {}
retrieval:
  retriever: toy
  options: {}
  statistics_scope: window
  target_enhancement_ppm: 10.0
  band_windows_nm: [[2080.0, 2500.0]]
  min_n_samples: 1
negatives:
  fraction: 0.3
labels:
  detection_snr: 2.0
  ambiguous_snr: 1.0
split:
  ratios: {train: 0.5, val: 0.5, test: 0.0} # three toy scenes, two cases
  group_by: [background_group, les_case]
  seed: null
output:
  root: /tmp/spectra_toy/dataset
  product_format: netcdf
  dataset_version: toy-v1
compute:
  chunks: {}
  slurm: null
